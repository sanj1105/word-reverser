name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Compile C++ to WebAssembly
        run: |
          mkdir site
          em++ -std=c++17 -O2 wasm/reverse_wasm.cpp -o site/reverse.js \
            -sMODULARIZE=1 -sEXPORT_NAME=createReverser -sENVIRONMENT=web \
            -sEXPORTED_FUNCTIONS=_reverse_text,_count_words \
            -sEXPORTED_RUNTIME_METHODS=ccall
          cp frontend/index.html site/index.html
          ls -l site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
