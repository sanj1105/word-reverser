<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Reverser</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
    --accent: #2f6f5e; --accent-ink: #ffffff; --border: #dcdad2; --out: #eef4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --card: #1e201d; --ink: #ecebe6; --muted: #9a998f;
            --accent: #5fb89f; --accent-ink: #0f1a16; --border: #34372f; --out: #1a2420; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  textarea { width: 100%; min-height: 120px; resize: vertical; padding: 12px; font: inherit;
             color: var(--ink); background: transparent; border: 1px solid var(--border); border-radius: 8px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .modes label { flex: 1 1 150px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .modes input { margin-right: 6px; accent-color: var(--accent); }
  .modes small { display: block; color: var(--muted); margin-left: 22px; }
  .modes label:has(input:checked) { border-color: var(--accent); background: var(--out); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--border); font-weight: 500; }
  .row { display: flex; gap: 8px; align-items: center; }
  #result { margin-top: 20px; padding: 14px; background: var(--out); border-radius: 8px;
            white-space: pre-wrap; word-break: break-word; min-height: 24px; }
  #meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
  #error { color: #c0392b; margin-top: 10px; }
  h2 { font-size: 16px; margin: 28px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  li span:first-child { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Word Reverser</h1>
  <p class="sub">Powered by C++ (native server locally, WebAssembly on GitHub Pages).</p>

  <div class="card">
    <textarea id="input" placeholder="Type or paste some text…">The quick brown fox jumps over the lazy dog</textarea>

    <div class="modes">
      <label><input type="radio" name="mode" value="words" checked>Word order
        <small>fox the → the fox</small></label>
      <label><input type="radio" name="mode" value="letters">Each word
        <small>fox → xof</small></label>
      <label><input type="radio" name="mode" value="full">Whole text
        <small>fox the → eht xof</small></label>
    </div>

    <div class="row">
      <button id="go">Reverse</button>
      <button id="copy" class="ghost">Copy result</button>
    </div>

    <div id="result" aria-live="polite"></div>
    <div id="meta"></div>
    <div id="error"></div>
  </div>

  <h2>History (click to reuse)</h2>
  <ul id="history"></ul>
</main>

<script src="reverse.js"></script>
<script>
const $ = id => document.getElementById(id);
const history = [];

// On GitHub Pages, reverse.js (the C++ code compiled to WebAssembly) is present and runs
// in the browser. Locally it is absent, so we call the C++ server's API instead.
const MODES = { words: 0, letters: 1, full: 2 };
let wasmPromise = null;
function getWasm() {
  if (typeof createReverser !== "function") return null;
  if (!wasmPromise) wasmPromise = createReverser();
  return wasmPromise;
}

async function reverseText(text, mode) {
  const wasm = getWasm();
  if (wasm) {
    const m = await wasm;
    return {
      result: m.ccall("reverse_text", "string", ["string", "number"], [text, MODES[mode]]),
      mode,
      words: m.ccall("count_words", "number", ["string"], [text])
    };
  }
  const res = await fetch("/api/reverse?mode=" + mode, { method: "POST", body: text });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function reverse() {
  $("error").textContent = "";
  const text = $("input").value;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  try {
    const data = await reverseText(text, mode);
    $("result").textContent = data.result;
    $("meta").textContent = data.words + " word" + (data.words === 1 ? "" : "s") + " · mode: " + data.mode;
    history.unshift({ text, mode, result: data.result });
    if (history.length > 8) history.pop();
    renderHistory();
  } catch (e) {
    $("error").textContent = "Request failed: " + e.message;
  }
}

function renderHistory() {
  const ul = $("history");
  ul.textContent = "";
  history.forEach(h => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.textContent = h.text.slice(0, 40) + (h.text.length > 40 ? "…" : "");
    const b = document.createElement("span"); b.textContent = h.mode;
    li.append(a, b);
    li.onclick = () => {
      $("input").value = h.text;
      document.querySelector('input[value="' + h.mode + '"]').checked = true;
      $("result").textContent = h.result;
    };
    ul.append(li);
  });
}

$("go").onclick = reverse;
$("copy").onclick = () => navigator.clipboard.writeText($("result").textContent);
$("input").addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") reverse(); });
reverse();
</script>
</body>
</html>
